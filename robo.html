<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Painel de Controle do Robô</title>
    <script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; background: #222; color: #fff;}
        video { width: 80%; max-width: 800px; background: #000; border: 2px solid #555; border-radius: 8px; margin-top: 15px;}
        .controls { margin-top: 20px; }
        button { padding: 15px 30px; font-size: 18px; margin: 5px; cursor: pointer; border: none; border-radius: 5px; font-weight: bold;}
        .btn-connect { background-color: #28a745; color: white; width: 300px; font-size: 20px;}
        .btn-connect:hover { background-color: #218838; }
        .data-panel { background: #333; padding: 10px; margin-top: 15px; border-radius: 5px; display: inline-block; }
    </style>
</head>
<body>
    <h2>Painel do Operador</h2>
    
    <div>
        <button class="btn-connect" onclick="conectar()">Conectar ao Robô</button>
    </div>

    <video id="remote-video" autoplay playsinline muted></video>
    <br>
    <button onclick="desmutar()" style="padding: 10px; font-size: 14px; background: #007bff; color: white;">Ativar Áudio do Robô</button>
    
    <div class="data-panel">
        <p style="margin: 5px 0;">GPS: <strong id="gps-data">Aguardando...</strong></p>
        <p style="margin: 5px 0;">Bússola: <strong id="compass-data">0°</strong></p>
    </div>

    <div class="controls">
        <button onmousedown="enviar('F')" onmouseup="enviar('S')">Frente (W)</button><br>
        <button onmousedown="enviar('L')" onmouseup="enviar('S')">Esq (A)</button>
        <button onmousedown="enviar('S')">Parar (Espaço)</button>
        <button onmousedown="enviar('R')" onmouseup="enviar('S')">Dir (D)</button><br>
        <button onmousedown="enviar('B')" onmouseup="enviar('S')">Trás (S)</button>
    </div>

    <script>
        const peer = new Peer(); // O PC gera um ID aleatório, não importa para nós
        let dataConnection;

        // O PC espera receber a chamada de vídeo vinda do robô
        peer.on('call', call => {
            console.log("Recebendo chamada de vídeo do robô...");
            call.answer(); // Responde a chamada sem enviar vídeo
            
            call.on('stream', remoteStream => {
                console.log("Stream de vídeo recebido com sucesso!");
                const video = document.getElementById('remote-video');
                video.srcObject = remoteStream;
                video.play().catch(err => console.error("Erro no autoplay:", err));
            });
        });

        function conectar() {
            // Usa o ID fixo que definimos no arquivo robo.html
            const idFixo = "meu-robo-secreto-778899"; 
            
            dataConnection = peer.connect(idFixo);
            
            dataConnection.on('open', () => {
                console.log("Conectado ao celular!");
                document.querySelector('.btn-connect').style.backgroundColor = "#ffc107";
                document.querySelector('.btn-connect').style.color = "#000";
                document.querySelector('.btn-connect').innerText = "Sincronizado!";
            });
            
            dataConnection.on('data', data => {
                let info = JSON.parse(data);
                if (info.lat) document.getElementById('gps-data').innerText = `${info.lat.toFixed(5)}, ${info.lon.toFixed(5)}`;
                if (info.compass) document.getElementById('compass-data').innerText = `${info.compass}°`;
            });
        }

        function desmutar() {
            document.getElementById('remote-video').muted = false;
        }

        function enviar(cmd) {
            if(dataConnection && dataConnection.open) {
                dataConnection.send(cmd);
            }
        }

        // Comandos pelo teclado do PC
        document.addEventListener('keydown', (e) => {
            if(e.repeat) return; // Evita envio contínuo repetido pelo SO
            if(e.key === 'w' || e.key === 'W') enviar('F');
            if(e.key === 's' || e.key === 'S') enviar('B');
            if(e.key === 'a' || e.key === 'A') enviar('L');
            if(e.key === 'd' || e.key === 'D') enviar('R');
            if(e.key === ' ') enviar('S');
        });
        
        document.addEventListener('keyup', (e) => {
            if(['w','W','s','S','a','A','d','D',' '].includes(e.key)) {
                enviar('S'); // Para o robô ao soltar a tecla
            }
        });
    </script>
</body>
</html>
