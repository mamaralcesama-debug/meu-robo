<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Robô - Transmissor + Telemetria Nútria</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; background: #222; color: #fff; margin: 0; padding: 20px; }
        video { width: 100%; max-width: 400px; background: #000; border-radius: 8px; border: 2px solid #444; }
        #status { font-weight: bold; margin: 15px auto; padding: 12px; border-radius: 5px; max-width: 400px; }
        .connected { background: #2e7d32; } .disconnected { background: #c62828; } .connecting { background: #ef6c00; }
    </style>
</head>
<body>

    <h2>🤖 Robô (Transmissor com GPS/Bússola)</h2>
    <video id="localVideo" autoplay playsinline muted></video>
    <div id="status" class="disconnected">Iniciando sistema...</div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAPJOs-lOFuA0zqZrJKmdrWrSr4Vf2dNx0",
            authDomain: "robo-webrtc-7b32b.firebaseapp.com",
            databaseURL: "https://robo-webrtc-7b32b-default-rtdb.firebaseio.com",
            projectId: "robo-webrtc-7b32b",
            storageBucket: "robo-webrtc-7b32b.firebasestorage.app",
            messagingSenderId: "488205904754",
            appId: "1:488205904754:web:52a95187cb2896da5d8beb",
            measurementId: "G-N5F97EE30J"
        };
        
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        const roomRef = db.ref('robot_stream');

        let peerConnection = null;
        let localStream = null;
        let watchDogTimer = null;
        const statusDiv = document.getElementById('status');

        // VARIÁVEIS DE TELEMETRIA DO SMARTPHONE
        let latAtual = 0, lngAtual = 0, headingAtual = 0;

        async function iniciarRobo() {
            try {
                localStream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: "environment", width: { ideal: 640 }, height: { ideal: 480 }, frameRate: { ideal: 20 } },
                    audio: true
                });
                document.getElementById('localVideo').srcObject = localStream;
                statusDiv.className = "connecting"; statusDiv.innerText = "Limpando conexões antigas...";
                
                await roomRef.remove();
                criarPeerConnection();
                ativarSensoresNativos(); // Inicializa GPS e Bússola no celular do robô
            } catch (error) {
                statusDiv.className = "disconnected"; statusDiv.innerText = "Erro nas permissões de hardware.";
            }
        }

        // SISTEMA DE CAPTURA DO GPS E BÚSSOLA INTERNOS DO APARELHO
        function activarSensoresNativos() {
            if (navigator.geolocation) {
                navigator.geolocation.watchPosition(pos => {
                    latAtual = pos.coords.latitude; lngAtual = pos.coords.longitude;
                }, null, { enableHighAccuracy: true });
            }
            if (window.DeviceOrientationEvent) {
                window.addEventListener('deviceorientationabsolute', e => {
                    if (e.alpha !== null) headingAtual = (360 - e.alpha) % 360;
                }, true);
            }
        }

        // MONITORAMENTO DE COMANDOS DO FIREBASE -> REPASSE LOCAL (MIT APP)
        let ultimoCmd = "";
        roomRef.child('controls/cmd').on('value', async snapshot => {
            const cmd = snapshot.val();
            if (cmd) {
                ultimoCmd = cmd;
                try {
                    // Manda comando pro MIT via HTTP e captura o retorno Serial que o ESP enviou de volta
                    let resposta = await fetch(`http://localhost:8080/?send=${encodeURIComponent(cmd)}`);
                    let dadosEsp = await resposta.text();
                    
                    // Sobe pacote consolidado de Telemetria (GPS Celular + Dados do ESP) para o Firebase
                    roomRef.child('telemetry').set({
                        lat: latAtual,
                        lng: lngAtual,
                        heading: headingAtual,
                        espReturn: dadosEsp
                    });
                } catch (err) {
                    console.log("App MIT Bridge fechado ou inicializando...");
                }
            }
        });

        function criarPeerConnection() {
            peerConnection = new RTCPeerConnection({
                iceServers: [{ urls: 'stun:stun.l.google.com:19302' }, { urls: 'turn:openrelay.metered.ca:443', username: 'openrelayproject', credential: 'openrelayproject' }],
                iceCandidatePoolSize: 10
            });
            
            localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));

            peerConnection.onconnectionstatechange = () => {
                if (peerConnection.connectionState === 'connected') {
                    statusDiv.className = "connected"; statusDiv.innerText = "Conectado ao Observador!";
                    clearTimeout(watchDogTimer);
                } else if (peerConnection.connectionState === 'disconnected' || peerConnection.connectionState === 'failed') {
                    statusDiv.className = "disconnected"; statusDiv.innerText = "Reiniciando em 5s...";
                    programarRecarregamento(5000);
                }
            };

            peerConnection.onicecandidate = event => { if (event.candidate) roomRef.child('callerCandidates').push(event.candidate.toJSON()); };
            criarOferta();
        }

        async function criarOferta() {
            const offer = await peerConnection.createOffer();
            await peerConnection.setLocalDescription(offer);
            await roomRef.child('offer').set({ sdp: offer.sdp, type: offer.type, status: "active" });
            programarRecarregamento(15000);

            roomRef.child('answer').on('value', snapshot => {
                const answer = snapshot.val();
                if (peerConnection.signalingState !== 'stable' && answer) {
                    peerConnection.setRemoteDescription(new RTCSessionDescription(answer));
                }
            });

            roomRef.child('calleeCandidates').on('child_added', snapshot => {
                const candidate = new RTCIceCandidate(snapshot.val());
                peerConnection.addIceCandidate(candidate).catch(e => console.error(e));
            });
        }

        function programarRecarregamento(tempo) {
            clearTimeout(watchDogTimer);
            watchDogTimer = setTimeout(() => {
                if (peerConnection && peerConnection.connectionState !== 'connected') window.location.reload();
            }, tempo);
        }

        window.onload = iniciarRobo;
    </script>
</body>
</html>
