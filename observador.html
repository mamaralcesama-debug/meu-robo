<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Observador - Teleoperação</title>
    
    <script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>
    
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            display: flex; 
            flex-direction: row;
            height: 100vh;
            background: #1a1a1a; 
            color: #eaeaea;
            overflow: hidden;
        }
        .panel { 
            flex: 1; 
            height: 100%;
            padding: 25px; 
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
        }
        #video-panel {
            background: #111;
            border-right: 2px solid #333;
            align-items: center;
            justify-content: center;
        }
        #control-panel {
            background: #222;
            overflow-y: auto;
        }
        h3 {
            margin-bottom: 15px;
            text-transform: uppercase;
            font-size: 14px;
            letter-spacing: 1px;
            color: #00ff88;
            border-bottom: 1px solid #444;
            padding-bottom: 5px;
        }
        video { 
            width: 100%; 
            max-height: 70vh;
            border-radius: 8px; 
            background: #000;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        .btn-connect {
            margin-top: 15px;
            padding: 12px 24px;
            background: #00ff88;
            color: #111;
            font-weight: bold;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: 0.2s;
        }
        .btn-connect:hover { background: #00cc6c; }
        
        .telemetria-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 25px;
            background: #2b2b2b;
            padding: 15px;
            border-radius: 6px;
        }
        .tel-item { text-align: center; }
        .tel-item span { display: block; font-size: 18px; font-weight: bold; color: #fff; margin-top: 5px;}

        .control-grid { 
            display: grid; 
            grid-template-columns: repeat(3, 1fr); 
            gap: 10px; 
            width: 220px; 
            margin: 0 auto 25px auto; 
        }
        .btn-dir { 
            padding: 20px; 
            background: #3a3a3a; 
            color: #fff; 
            border: none; 
            cursor: pointer; 
            font-size: 18px;
            border-radius: 8px;
            user-select: none;
            -webkit-user-select: none;
        }
        .btn-dir:active { background: #00ff88; color: #111; }
        .btn-stop { background: #d93838; }
        .btn-stop:active { background: #b32424; color: #fff; }

        .slider-container { 
            margin-bottom: 18px; 
            background: #2b2b2b;
            padding: 12px;
            border-radius: 6px;
        }
        .slider-header { display: flex; justify-content: space-between; margin-bottom: 5px; }
        .slider-header span { font-weight: bold; color: #00ff88; }
        input[type="range"] { 
            width: 100%; 
            accent-color: #00ff88;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="panel" id="video-panel">
        <h3>Transmissão de Vídeo em Tempo Real (WebRTC)</h3>
       <video id="remoteVideo" autoplay playsinline muted controls></video>
        <button class="btn-connect" onclick="conectarAoRobo()">LIGAR CÂMERA DO ROBÔ</button>
    </div>

    <div class="panel" id="control-panel">
        
        <h3>Telemetria do Rover</h3>
        <div class="telemetria-container">
            <div class="tel-item">Latitude<span id="txtLat">---</span></div>
            <div class="tel-item">Longitude<span id="txtLng">---</span></div>
            <div class="tel-item">Bússola<span id="txtBussula">---</span>°</div>
        </div>
        
        <h3>Controles de Movimento (Ponte H)</h3>
        <div class="control-grid">
            <div></div>
            <button class="btn-dir" onmousedown="enviarComando('FRENTE')" onmouseup="enviarComando('PARAR')" ontouchstart="enviarComando('FRENTE')" ontouchend="enviarComando('PARAR')">▲</button>
            <div></div>
            
            <button class="btn-dir" onmousedown="enviarComando('ESQUERDA')" onmouseup="enviarComando('PARAR')" ontouchstart="enviarComando('ESQUERDA')" ontouchend="enviarComando('PARAR')">◀</button>
            <button class="btn-dir btn-stop" onclick="enviarComando('PARAR')">■</button>
            <button class="btn-dir" onmousedown="enviarComando('DIREITA')" onmouseup="enviarComando('PARAR')" ontouchstart="enviarComando('DIREITA')" ontouchend="enviarComando('PARAR')">▶</button>
            
            <div></div>
            <button class="btn-dir" onmousedown="enviarComando('RE')" onmouseup="enviarComando('PARAR')" ontouchstart="enviarComando('RE')" ontouchend="enviarComando('PARAR')">▼</button>
            <div></div>
        </div>

        <h3>Controle do Braço Articulado (Servos)</h3>
        <div class="slider-container">
            <div class="slider-header"><label>Yaw (Base):</label> <span id="v1">90</span>°</div>
            <input type="range" min="0" max="180" value="90" oninput="enviarServo('servo_yaw', this.value, 'v1')">
        </div>
        
        <div class="slider-container">
            <div class="slider-header"><label>Cotovelo:</label> <span id="v2">90</span>°</div>
            <input type="range" min="0" max="180" value="90" oninput="enviarServo('servo_cotovelo', this.value, 'v2')">
        </div>
        
        <div class="slider-container">
            <div class="slider-header"><label>Punho:</label> <span id="v3">90</span>°</div>
            <input type="range" min="0" max="180" value="90" oninput="enviarServo('servo_punho', this.value, 'v3')">
        </div>
        
        <div class="slider-container">
            <div class="slider-header"><label>Garra:</label> <span id="v4">10</span>°</div>
            <input type="range" min="0" max="90" value="10" oninput="enviarServo('servo_garra', this.value, 'v4')">
        </div>
    </div>

    <script>
        // Configuração do Firebase populada com as suas credenciais
        const firebaseConfig = {
            apiKey: "AIzaSyAPJOs-lOFuA0zqZrJKmdrWrSr4Vf2dNx0",
            authDomain: "robo-webrtc-7b32b.firebaseapp.com",
            databaseURL: "https://robo-webrtc-7b32b-default-rtdb.firebaseio.com",
            projectId: "robo-webrtc-7b32b",
            storageBucket: "robo-webrtc-7b32b.firebasestorage.app",
            messagingSenderId: "488205904754",
            appId: "1:488205904754:web:52a95187cb2896da5d8beb",
            measurementId: "G-N5F97EE30J"
        };
        
        // Inicializa o Firebase
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // Configuração WebRTC (PeerJS) com IDs fixos solicitados
        const peer = new Peer('painel1');
        
        peer.on('open', (id) => {
            console.log('Painel de controle online. ID WebRTC:', id);
        });

        function conectarAoRobo() {
            console.log('Solicitando conexão de mídia para: robo1');
            // Realiza a chamada WebRTC para o celular no robô
            const call = peer.call('robo1', new MediaStream());
            
            call.on('stream', (remoteStream) => {
                console.log('Stream de vídeo em tempo real renderizado.');
                document.getElementById('remoteVideo').srcObject = remoteStream;
            });

            call.on('error', (err) => {
                console.error('Falha na chamada:', err);
                alert('Erro ao conectar na câmera do robô. Garanta que a página index.html esteja ativa no celular do rover.');
            });
        }

        // Envio de comandos para Ponte H
        function enviarComando(cmd) {
            db.ref('controles/movimento').set(cmd);
        }

        // Envio de posicionamento dos Servos
        function enviarServo(servo, valor, labelId) {
            document.getElementById(labelId).innerText = valor;
            db.ref('controles/' + servo).set(parseInt(valor));
        }

        // Escuta em tempo real dos parâmetros de telemetria enviados pelo App Inventor
        db.ref('telemetria').on('value', (snapshot) => {
            const data = snapshot.val();
            if (data) {
                document.getElementById('txtLat').innerText = data.lat !== undefined ? data.lat : "---";
                document.getElementById('txtLng').innerText = data.lng !== undefined ? data.lng : "---";
                document.getElementById('txtBussula').innerText = data.bussula !== undefined ? data.bussula : "---";
            }
        });
    </script>
</body>
</html>
