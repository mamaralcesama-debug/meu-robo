<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel do Observador</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; background: #111; color: #fff; margin: 0; padding: 10px; }
        .container { max-width: 600px; margin: auto; }
        video { width: 100%; background: #000; border-radius: 8px; border: 2px solid #444; }
        #status { font-weight: bold; margin: 10px 0; padding: 8px; border-radius: 5px; }
        .connected { background: #2e7d32; }
        .disconnected { background: #c62828; }
        .connecting { background: #ef6c00; }
        button { background: #0288d1; color: white; border: none; padding: 12px 24px; font-size: 16px; border-radius: 5px; cursor: pointer; margin-top: 10px; width: 100%; }
    </style>
</head>
<body>

    <div class="container">
        <h2>👁️ Visão do Robô (Observador)</h2>
        <video id="remoteVideo" autoplay playsinline></video>
        <div id="status" class="disconnected">Aguardando Robô entrar online...</div>
        <button id="btnConectar" onclick="conectarAoRobo()">Conectar / Atualizar Visão</button>
    </div>

    <script>
        // ======= CONFIGURAÇÃO DO FIREBASE (USE A MESMA DO ROBO.HTML) =======
        const firebaseConfig = {
            apiKey: "SEU_API_KEY",
            authDomain: "SEU_AUTH_DOMAIN",
            projectId: "SEU_PROJECT_ID",
            storageBucket: "SEU_STORAGE_BUCKET",
            messagingSenderId: "SEU_MESSAGING_SENDER_ID",
            appId: "SEU_APP_ID"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const docRef = db.collection('calls').doc('robot_stream');

        // ======= CONFIGURAÇÃO WEBRTC (DEVE SER IGUAL À DO ROBÔ) =======
        const rtcConfig = {
            iceServers: [
                { urls: 'stun:stun.l.google.com:19302' },
                {
                    urls: 'turn:openrelay.metered.ca:443',
                    username: 'openrelayproject',
                    credential: 'openrelayproject'
                }
            ],
            iceCandidatePoolSize: 10,
        };

        let peerConnection = null;
        const statusDiv = document.getElementById('status');

        function conectarAoRobo() {
            if (peerConnection) {
                peerConnection.close();
            }

            peerConnection = new RTCPeerConnection(rtcConfig);
            statusDiv.className = "connecting";
            statusDiv.innerText = "Conectando e negociando canais...";

            // Quando o fluxo de vídeo remanescente chegar do robô, joga na tela
            peerConnection.ontrack = event => {
                const remoteVideo = document.getElementById('remoteVideo');
                if (remoteVideo.srcObject !== event.streams[0]) {
                    remoteVideo.srcObject = event.streams[0];
                    statusDiv.className = "connected";
                    statusDiv.innerText = "Transmissão Ao Vivo!";
                }
            };

            // Monitora quedas e status da conexão
            peerConnection.onconnectionstatechange = () => {
                if (peerConnection.connectionState === 'connected') {
                    statusDiv.className = "connected";
                    statusDiv.innerText = "Transmissão Ao Vivo!";
                } else if (peerConnection.connectionState === 'disconnected' || peerConnection.connectionState === 'failed') {
                    statusDiv.className = "disconnected";
                    statusDiv.innerText = "Conexão perdida com o robô.";
                }
            };

            // Envia os caminhos de rede (ICE Candidates) gerados pelo Observador de volta para o Firebase
            peerConnection.onicecandidate = event => {
                if (event.candidate) {
                    docRef.collection('calleeCandidates').add(event.candidate.toJSON());
                }
            };

            // Escuta as propostas de conexão enviadas pelo robô (incluindo ICE Restarts automáticos)
            docRef.onSnapshot(async snapshot => {
                const data = snapshot.data();
                
                // Se o robô mandar uma oferta (seja inicial ou de reconexão)
                if (data?.offer && (peerConnection.signalingState !== 'have-remote-offer' || data.offer.status === "reconnecting")) {
                    statusDiv.className = "connecting";
                    statusDiv.innerText = "Sincronizando sinal de reconexão...";
                    
                    await peerConnection.setRemoteDescription(new RTCSessionDescription(data.offer));
                    
                    const answerDescription = await peerConnection.createAnswer();
                    await peerConnection.setLocalDescription(answerDescription);

                    const answer = {
                        type: answerDescription.type,
                        sdp: answerDescription.sdp,
                    };
                    await docRef.update({ answer });
                }
            });

            // Captura os ICE Candidates enviados pelo robô celular
            docRef.collection('callerCandidates').onSnapshot(snapshot => {
                snapshot.docChanges().forEach(change => {
                    if (change.type === 'added') {
                        const data = change.doc.data();
                        const candidate = new RTCIceCandidate(data);
                        peerConnection.addIceCandidate(candidate).catch(e => console.error(e));
                    }
                });
            });
        }

        // Como o navegador exige interação do usuário para dar play em vídeos com áudio/mídia externa,
        // deixamos o gatilho inicial atrelado ao clique do botão.
    </script>
</body>
</html>
