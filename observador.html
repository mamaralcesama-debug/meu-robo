<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel do Observador (RTDB)</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; background: #111; color: #fff; margin: 0; padding: 10px; }
        .container { max-width: 600px; margin: auto; }
        video { width: 100%; background: #000; border-radius: 8px; border: 2px solid #444; }
        #status { font-weight: bold; margin: 10px 0; padding: 8px; border-radius: 5px; }
        .connected { background: #2e7d32; }
        .disconnected { background: #c62828; }
        .connecting { background: #ef6c00; }
        button { background: #0288d1; color: white; border: none; padding: 12px 24px; font-size: 16px; border-radius: 5px; cursor: pointer; margin-top: 10px; width: 100%; }
    </style>
</head>
<body>

    <div class="container">
        <h2>👁️ Visão do Robô (Observador)</h2>
        <video id="remoteVideo" autoplay playsinline></video>
        <div id="status" class="disconnected">Aguardando Robô entrar online...</div>
        <button id="btnConectar" onclick="conectarAoRobo()">Conectar / Atualizar Visão</button>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAPJOs-lOFuA0zqZrJKmdrWrSr4Vf2dNx0",
            authDomain: "robo-webrtc-7b32b.firebaseapp.com",
            databaseURL: "https://robo-webrtc-7b32b-default-rtdb.firebaseio.com",
            projectId: "robo-webrtc-7b32b",
            storageBucket: "robo-webrtc-7b32b.firebasestorage.app",
            messagingSenderId: "488205904754",
            appId: "1:488205904754:web:52a95187cb2896da5d8beb",
            measurementId: "G-N5F97EE30J"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        const roomRef = db.ref('robot_stream');

        const rtcConfig = {
            iceServers: [
                { urls: 'stun:stun.l.google.com:19302' },
                {
                    urls: 'turn:openrelay.metered.ca:443',
                    username: 'openrelayproject',
                    credential: 'openrelayproject'
                }
            ],
            iceCandidatePoolSize: 10,
        };

        let peerConnection = null;
        const statusDiv = document.getElementById('status');

        function conectarAoRobo() {
            if (peerConnection) peerConnection.close();

            peerConnection = new RTCPeerConnection(rtcConfig);
            statusDiv.className = "connecting";
            statusDiv.innerText = "Conectando e negociando canais...";

            peerConnection.ontrack = event => {
                const remoteVideo = document.getElementById('remoteVideo');
                if (remoteVideo.srcObject !== event.streams[0]) {
                    remoteVideo.srcObject = event.streams[0];
                    statusDiv.className = "connected";
                    statusDiv.innerText = "Transmissão Ao Vivo!";
                }
            };

            peerConnection.onconnectionstatechange = () => {
                if (peerConnection.connectionState === 'connected') {
                    statusDiv.className = "connected";
                    statusDiv.innerText = "Transmissão Ao Vivo!";
                } else if (peerConnection.connectionState === 'disconnected' || peerConnection.connectionState === 'failed') {
                    statusDiv.className = "disconnected";
                    statusDiv.innerText = "Conexão perdida com o robô.";
                }
            };

            peerConnection.onicecandidate = event => {
                if (event.candidate) {
                    roomRef.child('calleeCandidates').push(event.candidate.toJSON());
                }
            };

            // Escuta a oferta do robô
            roomRef.child('offer').on('value', async snapshot => {
                const offer = snapshot.val();
                if (offer && (peerConnection.signalingState !== 'have-remote-offer' || offer.status === "reconnecting")) {
                    statusDiv.className = "connecting";
                    statusDiv.innerText = "Sincronizando sinal...";
                    
                    await peerConnection.setRemoteDescription(new RTCSessionDescription(offer));
                    const answerDescription = await peerConnection.createAnswer();
                    await peerConnection.setLocalDescription(answerDescription);

                    await roomRef.child('answer').set({
                        type: answerDescription.type,
                        sdp: answerDescription.sdp,
                    });
                }
            });

            // Escuta candidatos enviados pelo robô
            roomRef.child('callerCandidates').on('child_added', snapshot => {
                const candidate = new RTCIceCandidate(snapshot.val());
                peerConnection.addIceCandidate(candidate).catch(e => console.error(e));
            });
        }
    </script>
</body>
</html>
