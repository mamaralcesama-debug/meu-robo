<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Painel de Controle do Robô</title>
    <script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; background: #222; color: #fff;}
        video { width: 80%; max-width: 800px; background: #000; border: 2px solid #555;}
        .controls { margin-top: 20px; }
        button { padding: 15px 30px; font-size: 18px; margin: 5px; cursor: pointer; }
        .data-panel { background: #333; padding: 10px; margin-top: 15px; border-radius: 5px; display: inline-block; }
    </style>
</head>
<body>
    <h2>Painel do Operador</h2>
    <div>
        <input type="text" id="robo-id" placeholder="Digite o ID do Celular" style="padding: 5px;">
        <button onclick="conectar()">Conectar ao Robô</button>
    </div>
    <br>
    <video id="remote-video" autoplay></video>
    
    <div class="data-panel">
        <p>GPS: <span id="gps-data">Buscando...</span></p>
        <p>Bússola: <span id="compass-data">0°</span></p>
    </div>

    <div class="controls">
        <button onmousedown="enviar('F')" onmouseup="enviar('S')">Frente (W)</button><br>
        <button onmousedown="enviar('L')" onmouseup="enviar('S')">Esq (A)</button>
        <button onmousedown="enviar('S')">Parar (Espaço)</button>
        <button onmousedown="enviar('R')" onmouseup="enviar('S')">Dir (D)</button><br>
        <button onmousedown="enviar('B')" onmouseup="enviar('S')">Trás (S)</button>
    </div>

    <script>
        const peer = new Peer();
        let dataConnection;

        function conectar() {
            const id = document.getElementById('robo-id').value;
            if(!id) return alert("Digite o ID");

            // Conecta canal de dados (Comandos e Sensores)
            dataConnection = peer.connect(id);
            dataConnection.on('open', () => console.log("Conectado para comandos!"));
            dataConnection.on('data', data => {
                let info = JSON.parse(data);
                if (info.lat) document.getElementById('gps-data').innerText = `${info.lat.toFixed(5)}, ${info.lon.toFixed(5)}`;
                if (info.compass) document.getElementById('compass-data').innerText = `${info.compass}°`;
            });

            // Conecta canal de mídia (Vídeo/Áudio)
            const call = peer.call(id, null); // PC não envia vídeo, só recebe
            call.on('stream', remoteStream => {
                document.getElementById('remote-video').srcObject = remoteStream;
            });
        }

        function enviar(cmd) {
            if(dataConnection && dataConnection.open) {
                dataConnection.send(cmd);
            }
        }

        // Suporte a teclado
        document.addEventListener('keydown', (e) => {
            if(e.key === 'w' || e.key === 'W') enviar('F');
            if(e.key === 's' || e.key === 'S') enviar('B');
            if(e.key === 'a' || e.key === 'A') enviar('L');
            if(e.key === 'd' || e.key === 'D') enviar('R');
        });
        document.addEventListener('keyup', () => enviar('S'));
    </script>
</body>
</html>
