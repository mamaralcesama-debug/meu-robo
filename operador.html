<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Rover - Monitor Traseiro</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        :root { --bg: #121212; --card: #1e1e1e; --primary: #007aff; --accent: #ff9500; --text: #ffffff; }
        body { font-family: system-ui, sans-serif; background-color: var(--bg); color: var(--text); margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        h1 { font-size: 1.6rem; margin-bottom: 5px; }
        .dashboard { display: grid; grid-template-columns: repeat(auto-fit, minmax(360px, 1fr)); gap: 20px; width: 100%; max-width: 1200px; margin-top: 15px; }
        .card { background: var(--card); border-radius: 12px; padding: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.4); display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 285px; }
        
        .video-container { width: 100%; position: relative; background: #000; border-radius: 8px; overflow: hidden; aspect-ratio: 4/3; }
        video { width: 100%; height: 100%; object-fit: cover; background: #000; }
        
        .osd-label { position: absolute; background: rgba(0, 0, 0, 0.6); color: #4cd964; padding: 4px 8px; font-family: 'Courier New', monospace; font-size: 0.85rem; font-weight: bold; border-radius: 4px; pointer-events: none; border: 1px solid rgba(76, 217, 100, 0.3); }
        #osdTras   { bottom: 15px; left: 50%; transform: translateX(-50%); color: #ff3b30; border-color: rgba(255, 59, 48, 0.4); font-size: 1rem; }
        #osdBussola { top: 15px; right: 15px; color: #007aff; border-color: rgba(0,122,255,0.4); }
        #osdGPS     { top: 15px; left: 15px; color: #fff; border-color: rgba(255,255,255,0.2); }

        #mapa { width: 100%; height: 250px; border-radius: 8px; background: #222; border: 1px solid #333; }
        .arm-control { width: 100%; display: flex; flex-direction: column; gap: 12px; }
        .slider-group { display: flex; flex-direction: column; width: 100%; text-align: left; }
        .slider-group label { font-size: 0.9rem; margin-bottom: 4px; color: #aaa; display: flex; justify-content: space-between; }
        .slider-group label span { color: var(--accent); font-weight: bold; }
        .slider-group input[type=range] { width: 100%; height: 8px; border-radius: 4px; background: #333; accent-color: var(--primary); }
        
        .control-pad { display: grid; grid-template-areas: ". up ." "left down right"; gap: 12px; }
        .btn-control { width: 65px; height: 65px; background: var(--primary); color: white; border: none; border-radius: 50%; font-size: 1.5rem; cursor: pointer; user-select: none; display: flex; align-items: center; justify-content: center; }
        button#btnConectar { background: #34c759; color: white; border: none; padding: 12px 35px; font-size: 1rem; border-radius: 8px; font-weight: bold; }
    </style>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
</head>
<body>

    <h1>Painel de Inspeção - Configuração Ré Única</h1>
    <button id="btnConectar" onclick="iniciarFluxoSinalizacao()">CONECTAR AO ROBÔ</button>

    <div class="dashboard">
        <div class="card">
            <div class="video-container">
                <video id="videoRemoto1" autoplay playsinline muted></video>
                <div id="osdGPS" class="osd-label">GPS: Buscando...</div>
                <div id="osdBussola" class="osd-label">DIR: 000°</div>
                <div id="osdTras" class="osd-label">DISTÂNCIA RECUO: -- mm</div>
            </div>
        </div>

        <div class="card">
            <h3 style="margin: 0 0 10px 0; font-size: 1.1rem; width: 100%; text-align: left;">Geolocalização</h3>
            <div id="mapa"></div>
        </div>

        <div class="card">
            <h3>Controles do Braço</h3>
            <div class="arm-control">
                <div class="slider-group">
                    <label>Giro da Base (Yaw): <span id="valBase">50%</span></label>
                    <input type="range" min="0" max="100" value="50" oninput="atualizarLabel('Base', this.value)" onchange="enviarComandoBraco('Y', this.value)">
                </div>
                <div class="slider-group">
                    <label>Cotovelo: <span id="valCotovelo">50%</span></label>
                    <input type="range" min="0" max="100" value="50" oninput="atualizarLabel('Cotovelo', this.value)" onchange="enviarComandoBraco('C', this.value)">
                </div>
                <div class="slider-group">
                    <label>Elevação do Punho: <span id="valPunho">50%</span></label>
                    <input type="range" min="0" max="100" value="50" oninput="atualizarLabel('Punho', this.value)" onchange="enviarComandoBraco('P', this.value)">
                </div>
                <div class="slider-group">
                    <label>Abertura da Garra: <span id="valGarra">0%</span></label>
                    <input type="range" min="0" max="100" value="0" oninput="atualizarLabel('Garra', this.value)" onchange="enviarComandoBraco('G', this.value)">
                </div>
            </div>
        </div>

        <div class="card">
            <h3>Movimentação do Rover</h3>
            <div class="control-pad">
                <button id="btnUp" class="btn-control" onmousedown="enviar('F')" onmouseup="enviar('S')">▲</button>
                <button id="btnLeft" class="btn-control" onmousedown="enviar('E')" onmouseup="enviar('S')">◀</button>
                <button id="btnDown" class="btn-control" onmousedown="enviar('T')" onmouseup="enviar('S')">▼</button>
                <button id="btnRight" class="btn-control" onmousedown="enviar('D')" onmouseup="enviar('S')">▶</button>
            </div>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAPJOs-lOFuA0zqZrJKmdrWrSr4Vf2dNx0",
            authDomain: "robo-webrtc-7b32b.firebaseapp.com",
            databaseURL: "https://robo-webrtc-7b32b-default-rtdb.firebaseio.com",
            projectId: "robo-webrtc-7b32b",
        };
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();
        let sinalizacaoRef = database.ref('sinalizacao');
        let peerConnection, dataChannel, map, roboMarker, primeiraCargaGPS = true;

        window.onload = () => {
            map = L.map('mapa').setView([-14.2350, -51.9253], 4);
            L.tileLayer('https://{s}.google.com/vt/lyrs=s,h&x={x}&y={y}&z={z}', { maxZoom: 20, subdomains: ['mt0', 'mt1', 'mt2', 'mt3'] }).addTo(map);
        };

        function atualizarLabel(id, valor) { document.getElementById('val' + id).innerText = valor + "%"; }
        function enviarComandoBraco(servoId, valor) { enviar(`B:${servoId}${valor}`); }
        function atualizarMapa(lat, lon) {
            if (primeiraCargaGPS) { map.setView([lat, lon], 18); roboMarker = L.marker([lat, lon]).addTo(map); primeiraCargaGPS = false; }
            else { roboMarker.setLatLng([lat, lon]); }
        }

        async function iniciarFluxoSinalizacao() {
            document.getElementById("btnConectar").innerText = "Sincronizando...";
            
            // Fecha conexões antigas locais se o operador clicar de novo
            if(peerConnection) { peerConnection.close(); peerConnection = null; }

            // Limpa o banco de dados completamente de maneira limpa
            await sinalizacaoRef.remove();

            // Pequeno delay para garantir que o robô detectou a limpeza e resetou do lado dele
            setTimeout(async () => {
                peerConnection = new RTCPeerConnection({ iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] });
                
                dataChannel = peerConnection.createDataChannel("comandos");
                dataChannel.onmessage = receberTelemetriaE_OSD;
                dataChannel.onopen = () => { document.getElementById("btnConectar").innerText = "SISTEMA ONLINE"; };
                
                peerConnection.ontrack = (e) => { document.getElementById('videoRemoto1').srcObject = e.streams[0]; };
                
                peerConnection.onicecandidate = (e) => { 
                    if (e.candidate) sinalizacaoRef.child('operador/iceCandidates').push(e.candidate.toJSON()); 
                };

                const offer = await peerConnection.createOffer({ offerToReceiveVideo: true });
                await peerConnection.setLocalDescription(offer);
                
                // Envia a oferta inicial estruturada
                await sinalizacaoRef.child('operador/offer').set({ type: offer.type, sdp: offer.sdp });
                
                // Escuta assíncrona da resposta do robô
                sinalizacaoRef.child('robo/answer').on('value', async (s) => { 
                    if (s.val() && !peerConnection.currentRemoteDescription) {
                        await peerConnection.setRemoteDescription(new RTCSessionDescription(s.val()));
                    }
                });
                
                // Agrega candidatos ICE do robô de forma dinâmica
                sinalizacaoRef.child('robo/iceCandidates').on('child_added', s => { 
                    if (s.val() && peerConnection && peerConnection.remoteDescription) {
                        peerConnection.addIceCandidate(new RTCIceCandidate(s.val())).catch(e => {});
                    }
                });
            }, 400);
        }

        function enviar(comando) { if (dataChannel && dataChannel.readyState === "open") dataChannel.send(comando); }

        function receberTelemetriaE_OSD(event) {
            try {
                const dados = JSON.parse(event.data);
                if (dados.tipo === "telemetria") {
                    const partes = dados.payload.split(';');
                    let valores = {};
                    partes.forEach(p => { const par = p.split(':'); if(par.length === 2) valores[par[0]] = par[1]; });
                    
                    if (valores['DIR'])  document.getElementById('osdBussola').innerText = `DIR: ${valores['DIR']}°`;
                    if (valores['TOF_T']) {
                        let v = valores['TOF_T'];
                        document.getElementById('osdTras').innerText = (v === "8190") ? "RÉ: LIVRE" : `DISTÂNCIA RECUO: ${v} mm`;
                    }
                    
                    if (valores['LAT'] && valores['LON'] && valores['LAT'] !== "0.0") {
                        const latNum = parseFloat(valores['LAT']); const lonNum = parseFloat(valores['LON']);
                        document.getElementById('osdGPS').innerText = `GPS: ${latNum.toFixed(5)}, ${lonNum.toFixed(5)}`;
                        atualizarMapa(latNum, lonNum);
                    }
                }
            } catch (err) {}
        }

        const comandosTeclado = { 'w': 'F', 'ArrowUp': 'F', 'a': 'E', 'ArrowLeft': 'E', 's': 'T', 'ArrowDown': 'T', 'd': 'D', 'ArrowRight': 'D' };
        let teclaAtiva = null;
        window.addEventListener('keydown', (e) => { const cmd = comandosTeclado[e.key]; if (cmd && teclaAtiva !== e.key) { teclaAtiva = e.key; enviar(cmd); } });
        window.addEventListener('keyup', (e) => { const cmd = comandosTeclado[e.key]; if (cmd && teclaAtiva === e.key) { teclaAtiva = null; enviar('S'); } });
    </script>
</body>
</html>
