<script>
    const video = document.getElementById('video');
    const status = document.getElementById('status');

    async function iniciar() {
        try {
            status.innerText = "Solicitando permissão da câmera...";
            const stream = await navigator.mediaDevices.getUserMedia({ video: true });
            video.srcObject = stream;
            video.onloadedmetadata = () => {
                status.innerText = "Câmera iniciada. Monitorando...";
                setInterval(processar, 3000);
            };
        } catch (err) {
            status.innerText = "ERRO: " + err.message;
            console.error("Erro na câmera:", err);
        }
    }

    // Chama a função de início
    iniciar();

    async function processar() {
        console.log("Tentando processar...");
        // ... restante do seu código ...
    }
</script>
