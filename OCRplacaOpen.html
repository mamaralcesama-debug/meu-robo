<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>AutoGate LPR com Visualização</title>
    <script src='https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js'></script>
    <style>
        body { background: #111; color: #fff; text-align: center; font-family: sans-serif; }
        /* O contêiner permite sobrepor o vídeo e o canvas */
        #container { position: relative; display: inline-block; }
        #video, #overlay { width: 600px; border-radius: 10px; }
        #overlay { position: absolute; top: 0; left: 0; pointer-events: none; }
        #status { margin: 20px; font-size: 1.2rem; }
    </style>
</head>
<body>
    <h1>Monitoramento de Placas</h1>
    <div id="container">
        <video id="video" autoplay playsinline></video>
        <canvas id="overlay"></canvas>
    </div>
    <div id="status">Iniciando...</div>
    <canvas id="hiddenCanvas" style="display:none;"></canvas>

    <script>
        const video = document.getElementById('video');
        const overlay = document.getElementById('overlay');
        const hiddenCanvas = document.getElementById('hiddenCanvas');
        const status = document.getElementById('status');
        
        const PLACAS_AUTORIZADAS = ["RIO2A18", "XYZ5678"];

        navigator.mediaDevices.getUserMedia({ video: true }).then(stream => video.srcObject = stream);

        async function processar() {
            const ctxOverlay = overlay.getContext('2d');
            const ctxHidden = hiddenCanvas.getContext('2d');
            
            hiddenCanvas.width = overlay.width = video.videoWidth;
            hiddenCanvas.height = overlay.height = video.videoHeight;
            ctxHidden.drawImage(video, 0, 0);
            
            // Limpa o retângulo anterior
            ctxOverlay.clearRect(0, 0, overlay.width, overlay.height);

            const { data } = await Tesseract.recognize(hiddenCanvas, 'eng');
            
            // Desenha retângulos em todas as palavras detectadas (para debug)
            data.words.forEach(word => {
                const { x0, y0, x1, y1 } = word.bbox;
                const isAuthorized = PLACAS_AUTORIZADAS.includes(word.text.trim());
                
                // Desenha retangulo verde se achar placa autorizada, cinza se não
                ctxOverlay.strokeStyle = isAuthorized ? '#0f0' : '#888';
                ctxOverlay.lineWidth = 3;
                ctxOverlay.strokeRect(x0, y0, x1 - x0, y1 - y0);

                if (isAuthorized) {
                    status.innerText = "Placa autorizada: " + word.text;
                    enviarComando();
                }
            });
        }

        async function enviarComando() {
            // Lógica de envio (aqui você chamaria o seu fetch do Telegram)
            console.log("Comando enviado!");
        }

        setInterval(processar, 3000);
    </script>
</body>
</html>
