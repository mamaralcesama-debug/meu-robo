<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Robô - Câmera e Sensores</title>
    <script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>
    <style>body { font-family: sans-serif; text-align: center; } video { width: 100%; max-width: 400px; transform: scaleX(-1); }</style>
</head>
<body>
    <h2>Robô - Central do Celular</h2>
    <p>Seu ID de Conexão: <strong id="peer-id">Gerando...</strong></p>
    <button id="btn-bluetooth">1. Conectar ao ESP32 (Bluetooth)</button>
    <p id="ble-status">Bluetooth Desconectado</p>
    <video id="video-stream" autoplay muted playsinline></video>
    <p id="sensor-data">GPS: Aguardando... | Bússola: Aguardando...</p>

    <script>
        const peer = new Peer();
        let dataChannel;
        let localStream;

        peer.on('open', id => { document.getElementById('peer-id').innerText = id; });

        // Garante que a câmera seja capturada logo ao abrir a página
        navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" }, audio: true })
            .then(stream => {
                localStream = stream;
                document.getElementById('video-stream').srcObject = stream;
            }).catch(err => alert("Erro ao acessar câmera/microfone: " + err));

        // O robô escuta a conexão de dados do PC
        peer.on('connection', conn => {
            dataChannel = conn;
            console.log("PC conectado via dados. Iniciando transmissão de vídeo...");

            // Correção: O próprio robô liga para o PC enviando o vídeo assim que o canal de dados abre
            if (localStream) {
                peer.call(conn.peer, localStream);
            } else {
                console.error("Stream de vídeo não estava pronto no momento da conexão.");
            }

            conn.on('data', data => {
                enviarComandoBLE(data);
            });
        });

        // Bluetooth Low Energy
        let bleCharacteristic;
        document.getElementById('btn-bluetooth').addEventListener('click', async () => {
            try {
                const device = await navigator.bluetooth.requestDevice({
                    filters: [{ name: 'Robo_ESP32' }],
                    optionalServices: ['6e400001-b5a3-f393-e0a9-e50e24dcca9e']
                });
                const server = await device.gatt.connect();
                const service = await server.getPrimaryService('6e400001-b5a3-f393-e0a9-e50e24dcca9e');
                bleCharacteristic = await service.getCharacteristic('6e400002-b5a3-f393-e0a9-e50e24dcca9e');
                document.getElementById('ble-status').innerText = "ESP32 Conectado!";
            } catch (error) { alert("Erro BLE: " + error); }
        });

        function enviarComandoBLE(cmd) {
            if (bleCharacteristic) {
                let encoder = new TextEncoder('utf-8');
                bleCharacteristic.writeValue(encoder.encode(cmd));
            }
        }

        // Sensores (GPS e Bússola)
        setInterval(() => {
            if(dataChannel && dataChannel.open) {
                navigator.geolocation.getCurrentPosition(pos => {
                    dataChannel.send(JSON.stringify({
                        lat: pos.coords.latitude,
                        lon: pos.coords.longitude
                    }));
                }, err => console.log("Erro GPS:", err), { enableHighAccuracy: true });
            }
        }, 2000);

        window.addEventListener('deviceorientationabsolute', (event) => {
            if(dataChannel && dataChannel.open && event.alpha !== null) {
                let compass = Math.round(360 - event.alpha);
                dataChannel.send(JSON.stringify({ compass: compass }));
                document.getElementById('sensor-data').innerText = `Bússola: ${compass}°`;
            }
        });
    </script>
</body>
</html>
