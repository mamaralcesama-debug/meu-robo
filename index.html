<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Robô - Transmissão Automatizada Pro</title>
    <style>
        body { font-family: Arial, sans-serif; background: #111; color: #fff; text-align: center; padding: 20px; }
        .status-box { border: 1px solid #333; padding: 15px; margin: 10px auto; max-width: 400px; border-radius: 8px; background: #222; }
        .status { font-weight: bold; color: #ff9500; }
        .connected { color: #4cd964; }
        video { width: 90%; max-width: 400px; margin: 5px; border: 2px solid #555; border-radius: 4px; background: #000; }
    </style>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
</head>
<body>

    <h1>Robô - Modo Autônomo Ativo</h1>
    <div class="status-box">
        <p>Status WebRTC: <span id="statusWebRTC" class="status">Inicializando Câmera...</span></p>
        <p>Bússola Local: <span id="txtBussola" style="color: #007aff; font-weight: bold;">0°</span></p>
        <p>Último Comando: <span id="txtComando" style="color: #4cd964; font-weight: bold;">-</span></p>
    </div>

    <div>
        <video id="videoLocal1" autoplay playsinline muted></video>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAPJOs-lOFuA0zqZrJKmdrWrSr4Vf2dNx0",
            authDomain: "robo-webrtc-7b32b.firebaseapp.com",
            databaseURL: "https://robo-webrtc-7b32b-default-rtdb.firebaseio.com",
            projectId: "robo-webrtc-7b32b",
            storageBucket: "robo-webrtc-7b32b.firebasestorage.app",
            messagingSenderId: "488205904754",
            appId: "1:488205904754:web:52a95187cb2896da5d8beb",
            measurementId: "G-N5F97EE30J"
        };
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();
        let sinalizacaoRef = database.ref('sinalizacao');

        let localStream1 = null;
        let peerConnection = null;
        let dataChannel = null;
        let intervaloTelemetria = null;

        let celularLat = 0.0, celularLon = 0.0, celularDirecao = 0, esp32Distancia = "--";
        const configuration = { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }, { urls: 'stun:stun1.l.google.com:19302' }] };

        window.onload = async () => {
            try {
                if ('wakeLock' in navigator) await navigator.wakeLock.request('screen');
                await iniciarCameraResiliente();
                ativarSensores();
                configurarEscutaSinalizacao();
            } catch (e) {
                atualizarStatus("Erro de Inicialização: " + e.message, "#ff3b30");
            }
        };

        async function iniciarCameraResiliente() {
            const videoElement = document.getElementById('videoLocal1');
            videoElement.srcObject = null;

            try {
                localStream1 = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: "environment", width: 640, height: 480 },
                    audio: false
                });
            } catch (e) {
                console.log("Falha na câmera traseira, tentando padrão/frontal...");
                localStream1 = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
            }

            if (localStream1) {
                videoElement.srcObject = localStream1;
                await videoElement.play().catch(err => console.log("Aguardando interação:", err));
            } else {
                throw new Error("Não foi possível capturar nenhuma câmera.");
            }
        }

        function configurarEscutaSinalizacao() {
            atualizarStatus("Pronto! Aguardando Operador...", "#007aff");
            sinalizacaoRef.child('operador/offer').off();
            
            sinalizacaoRef.child('operador/offer').on('value', async (snapshot) => {
                const offer = snapshot.val();
                
                if (!offer) {
                    resetarConexaoLocal();
                    return;
                }

                if (peerConnection && (peerConnection.connectionState === "connected" || peerConnection.signalingState !== "stable")) {
                    return;
                }

                criarPeerConnection();

                try {
                    await peerConnection.setRemoteDescription(new RTCSessionDescription(offer));
                    const answer = await peerConnection.createAnswer();
                    await peerConnection.setLocalDescription(answer);
                    
                    await sinalizacaoRef.child('robo/answer').set({ type: answer.type, sdp: answer.sdp });
                } catch (err) {
                    console.error("Erro na negociação do WebRTC:", err);
                    resetarConexaoLocal();
                }
            });

            sinalizacaoRef.child('operador/iceCandidates').off();
            sinalizacaoRef.child('operador/iceCandidates').on('child_added', snapshot => {
                const candidate = snapshot.val();
                if (candidate && peerConnection && peerConnection.remoteDescription) {
                    peerConnection.addIceCandidate(new RTCIceCandidate(candidate)).catch(e => {});
                }
            });
        }

        function criarPeerConnection() {
            if (peerConnection) resetarConexaoLocal();

            peerConnection = new RTCPeerConnection(configuration);

            if (localStream1) {
                localStream1.getTracks().forEach(track => peerConnection.addTrack(track, localStream1));
            }

            peerConnection.onicecandidate = (event) => {
                if (event.candidate) sinalizacaoRef.child('robo/iceCandidates').push(event.candidate.toJSON());
            };

            peerConnection.oniceconnectionstatechange = () => {
                const state = peerConnection.iceConnectionState;
                if (state === "disconnected" || state === "failed") {
                    atualizarStatus("Sinal instável. Resetando...", "#ff3b30");
                    resetarConexaoLocal();
                }
            };

            peerConnection.ondatachannel = (event) => {
                dataChannel = event.channel;
                dataChannel.onmessage = (e) => { 
                    // Atualiza a tela com o comando recebido do operador (F, T, E, D, S)
                    document.getElementById("txtComando").innerText = e.data; 
                };
                
                dataChannel.onopen = () => {
                    atualizarStatus("Conectado ao Operador", "#4cd964");
                    
                    if (intervaloTelemetria) clearInterval(intervaloTelemetria);
                    intervaloTelemetria = setInterval(() => {
                        if (dataChannel && dataChannel.readyState === "open") {
                            const pacote = `LAT:${celularLat};LON:${celularLon};DIR:${celularDirecao};DIST:${esp32Distancia}`;
                            dataChannel.send(JSON.stringify({ tipo: "telemetria", payload: pacote }));
                        }
                    }, 300);
                };
            };
        }

        function resetarConexaoLocal() {
            if (intervaloTelemetria) { clearInterval(intervaloTelemetria); intervaloTelemetria = null; }
            if (dataChannel) { dataChannel.close(); dataChannel = null; }
            if (peerConnection) { peerConnection.close(); peerConnection = null; }
            document.getElementById("txtComando").innerText = "-"; // Limpa o comando visual ao desconectar
            atualizarStatus("Aguardando Operador...", "#007aff");
        }

        function atualizarStatus(texto, cor) {
            const el = document.getElementById("statusWebRTC");
            if (el) { el.innerText = texto; el.style.color = cor; }
        }

        function ativarSensores() {
            if ("geolocation" in navigator) {
                navigator.geolocation.watchPosition(p => { celularLat = p.coords.latitude; celularLon = p.coords.longitude; }, null, { enableHighAccuracy: true });
            }
            if (window.DeviceOrientationEvent) {
                window.addEventListener("deviceorientationabsolute", e => {
                    if (e.alpha !== null) {
                        celularDirecao = Math.round(e.alpha);
                        document.getElementById("txtBussola").innerText = celularDirecao + "°";
                    }
                }, true);
            }
        }
    </script>
</body>
</html>
