<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Rover - Lado do Robô</title>
</head>
<body style="background: #121212; color: #fff; font-family: sans-serif; text-align: center; padding: 20px;">

    <h2>Rover - Servidor de Mídia e Comandos</h2>
    <div id="status" style="padding: 10px; background: #ff9500; color: #000; font-weight: bold; border-radius: 5px;">AGUARDANDO OPERADOR...</div>
    
    <video id="localVideo" autoplay playsinline muted style="width: 80%; max-width: 400px; margin-top: 20px; border-radius: 8px; transform: scaleX(-1);"></video>

    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAPJOs-lOFuA0zqZrJKmdrWrSr4Vf2dNx0",
            authDomain: "robo-webrtc-7b32b.firebaseapp.com",
            databaseURL: "https://robo-webrtc-7b32b-default-rtdb.firebaseio.com",
            projectId: "robo-webrtc-7b32b",
        };
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();
        const sinalizacaoRef = database.ref('sinalizacao');

        let peerConnection, localStream, dataChannel;

        async function iniciarMidia() {
            try {
                localStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" }, audio: false });
                document.getElementById('localVideo').srcObject = localStream;
                configurarEscuta();
            } catch (e) {
                document.getElementById('status').innerText = "ERRO NA CÂMERA: " + e.message;
            }
        }

        function configurarEscuta() {
            document.getElementById('status').innerText = "AGUARDANDO OFERTA DO OPERADOR...";
            document.getElementById('status').style.background = "#ff9500";

            // Fica monitorando a oferta criada pelo PC
            sinalizacaoRef.child('operador/offer').on('value', async (snapshot) => {
                const offerData = snapshot.val();
                if (offerData) {
                    console.log("Oferta recebida, iniciando conexão...");
                    inicializarPeerConnection();
                    
                    await peerConnection.setRemoteDescription(new RTCSessionDescription(offerData));
                    const answer = await peerConnection.createAnswer();
                    await peerConnection.setLocalDescription(answer);
                    
                    await sinalizacaoRef.child('robo/answer').set({ type: answer.type, sdp: answer.sdp });
                    document.getElementById('status').innerText = "OFERTA ACEITA! CONECTANDO VIA ICE...";
                }
            });

            // Monitora os candidatos ICE vindos do operador
            sinalizacaoRef.child('operador/iceCandidates').on('child_added', snapshot => {
                if (snapshot.val() && peerConnection && peerConnection.remoteDescription) {
                    peerConnection.addIceCandidate(new RTCIceCandidate(snapshot.val())).catch(e => {});
                }
            });
        }

        function inicializarPeerConnection() {
            if (peerConnection) peerConnection.close();

            peerConnection = new RTCPeerConnection({ iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] });

            localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));

            peerConnection.onicecandidate = (e) => {
                if (e.candidate) sinalizacaoRef.child('robo/iceCandidates').push(e.candidate.toJSON());
            };

            peerConnection.ondatachannel = (e) => {
                dataChannel = e.channel;
                dataChannel.onopen = () => {
                    document.getElementById('status').innerText = "CONECTADO E TRANSMITINDO!";
                    document.getElementById('status').style.background = "#34c759";
                };
                dataChannel.onmessage = (msg) => {
                    if(window.AndroidInterface) {
                        window.AndroidInterface.enviarAoEsp(msg.data);
                    } else {
                        console.log("Comando:", msg.data);
                    }
                };
            };
        }

        function injetarTelemetriaFronEnd(jsonString) {
            if (dataChannel && dataChannel.readyState === "open") {
                dataChannel.send(jsonString);
            }
        }

        window.onload = iniciarMidia;
    </script>
</body>
</html>
