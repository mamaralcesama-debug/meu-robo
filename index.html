<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Robô - Central do Celular</title>
    <script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>
</head>
<body>
    <h2>Cérebro do Robô</h2>
    <button id="btn-bluetooth">1. Conectar ao ESP32</button>
    <p id="ble-status">Status: Desconectado</p>
    <video id="video-stream" autoplay muted playsinline></video>

    <script>
        const peer = new Peer("meu-robo-secreto-778899");
        let bleCharacteristic;

        document.getElementById('btn-bluetooth').addEventListener('click', async () => {
            try {
                const device = await navigator.bluetooth.requestDevice({
                    acceptAllDevices: true,
                    optionalServices: ['6e400001-b5a3-f393-e0a9-e50e24dcca9e']
                });
                
                document.getElementById('ble-status').innerText = "Conectando ao GATT...";
                const server = await device.gatt.connect();
                
                document.getElementById('ble-status').innerText = "Buscando serviço...";
                const service = await server.getPrimaryService('6e400001-b5a3-f393-e0a9-e50e24dcca9e');
                bleCharacteristic = await service.getCharacteristic('6e400002-b5a3-f393-e0a9-e50e24dcca9e');
                
                document.getElementById('ble-status').innerText = "ESP32 Conectado com Sucesso! 🟢";
            } catch (error) { 
                alert("Erro BLE: " + error); 
            }
        });

        // (O restante do código de vídeo e PeerJS continua o mesmo)
    </script>
</body>
</html>
