<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Robô - Central de Transmissão (Android)</title>
    <style>
        body { font-family: Arial, sans-serif; background: #111; color: #fff; text-align: center; padding: 20px; }
        .status-box { border: 1px solid #333; padding: 15px; margin: 10px auto; max-width: 400px; border-radius: 8px; background: #222; }
        .status { font-weight: bold; color: #ff3b30; }
        .connected { color: #4cd964; }
        video { width: 90%; max-width: 400px; margin: 5px; border: 2px solid #555; border-radius: 4px; background: #000; }
        button { background: #34c759; color: white; border: none; padding: 15px 30px; font-size: 16px; border-radius: 8px; cursor: pointer; font-weight: bold; width: 100%; max-width: 400px; }
        button:disabled { background: #555; cursor: not-allowed; }
    </style>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
</head>
<body>

    <h1>Robô Ativo (Modo Android)</h1>
    <button id="btnIniciar" onclick="inicializarSistemaAndroid()">LIGAR SISTEMA DO ROBÔ</button>

    <div class="status-box">
        <p>Status WebRTC: <span id="statusWebRTC" class="status">Desconectado</span></p>
        <p>Bússola Local: <span id="txtBussola" style="color: #ff9500; font-weight: bold;">0°</span></p>
        <p>Último Comando: <span id="txtComando">-</span></p>
    </div>

    <div>
        <video id="videoLocal1" autoplay playsinline muted></video>
    </div>

    <script>
        // --- SUAS CREDENCIAIS REAIS ---
        const firebaseConfig = {
            apiKey: "AIzaSyAPJOs-lOFuA0zqZrJKmdrWrSr4Vf2dNx0",
            authDomain: "robo-webrtc-7b32b.firebaseapp.com",
            databaseURL: "https://robo-webrtc-7b32b-default-rtdb.firebaseio.com",
            projectId: "robo-webrtc-7b32b",
            storageBucket: "robo-webrtc-7b32b.firebasestorage.app",
            messagingSenderId: "488205904754",
            appId: "1:488205904754:web:52a95187cb2896da5d8beb",
            measurementId: "G-N5F97EE30J"
        };
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        let localStream1;
        let peerConnection;
        let dataChannel;
        let wakeLock = null;

        let celularLat = 0.0;
        let celularLon = 0.0;
        let celularDirecao = 0;
        let esp32Distancia = "--";

        // Servidores STUN estáveis na porta padrão (Excelente para Android em redes locais/Wi-Fi)
        const configuration = { 
            iceServers: [
                { urls: 'stun:stun.l.google.com:19302' },
                { urls: 'stun:stun1.l.google.com:19302' }
            ] 
        };

        // Captura global de erros para ajudar no debug
        window.onerror = function(msg) { alert('Erro Android: ' + msg); return true; }

        async function inicializarSistemaAndroid() {
            document.getElementById("btnIniciar").disabled = true;
            try {
                // Mantém a tela ligada no Android nativamente
                if ('wakeLock' in navigator) {
                    wakeLock = await navigator.wakeLock.request('screen');
                }
                
                // Inicia os fluxos
                await iniciarCameraAndroid();
                ativarSensoresAndroid();
                aguardarConexaoDoOperador();
                
            } catch (error) {
                alert("Erro ao inicializar: " + error.message);
                document.getElementById("btnIniciar").disabled = false;
            }
        }

        async function iniciarCameraAndroid() {
            try {
                // Solicita a câmera traseira do Android de forma limpa (environment)
                localStream1 = await navigator.mediaDevices.getUserMedia({
                    video: { 
                        facingMode: "environment",
                        width: { ideal: 640 },
                        height: { ideal: 480 }
                    }, 
                    audio: false
                });
                
                const videoElement = document.getElementById('videoLocal1');
                videoElement.srcObject = localStream1;
                
            } catch (e) {
                console.error("Erro na câmera do Android:", e);
                throw new Error("Permissão de câmera negada. Garanta que o Chrome tem acesso à câmera.");
            }
        }

        function ativarSensoresAndroid() {
            // GPS Nativo
            if ("geolocation" in navigator) {
                navigator.geolocation.watchPosition((position) => {
                    celularLat = position.coords.latitude;
                    celularLon = position.coords.longitude;
                }, (err) => console.error("Erro GPS:", err), { enableHighAccuracy: true });
            }

            // Bússola Nativa (No Android, o evento absoluto funciona direto sem travas de clique)
            if (window.DeviceOrientationEvent) {
                window.addEventListener("deviceorientationabsolute", (event) => {
                    if (event.alpha !== null) {
                        celularDirecao = Math.round(event.alpha);
                        document.getElementById("txtBussola").innerText = celularDirecao + "°";
                    }
                }, true);
            }
        }

        function aguardarConexaoDoOperador() {
            peerConnection = new RTCPeerConnection(configuration);

            // Injeta o fluxo da câmera do Android para a transmissão
            if (localStream1) {
                localStream1.getTracks().forEach(track => peerConnection.addTrack(track, localStream1));
            }

            // Recebe o canal de dados gerado pelo operador (PC)
            peerConnection.ondatachannel = (event) => {
                dataChannel = event.channel;
                dataChannel.onmessage = (e) => { 
                    document.getElementById("txtComando").innerText = e.data; 
                };
                
                dataChannel.onopen = () => {
                    document.getElementById("statusWebRTC").innerText = "Conectado ao Operador";
                    document.getElementById("statusWebRTC").className = "status connected";

                    // Ciclo contínuo de envio de telemetria (Bússola rodando viva)
                    setInterval(() => {
                        if (dataChannel && dataChannel.readyState === "open") {
                            const pacoteTelemetria = `LAT:${celularLat};LON:${celularLon};DIR:${celularDirecao};DIST:${esp32Distancia}`;
                            dataChannel.send(JSON.stringify({ tipo: "telemetria", payload: pacoteTelemetria }));
                        }
                    }, 500);
                };
            };

            const iceCandidatesRef = database.ref('sinalizacao/robo/iceCandidates');
            peerConnection.onicecandidate = (event) => {
                if (event.candidate) iceCandidatesRef.push(event.candidate.toJSON());
            };

            // Escuta a oferta criada pelo PC
            database.ref('sinalizacao/operador/offer').on('value', async (snapshot) => {
                const offer = snapshot.val();
                if (offer && !peerConnection.currentRemoteDescription) {
                    await peerConnection.setRemoteDescription(new RTCSessionDescription(offer));
                    const answer = await peerConnection.createAnswer();
                    await peerConnection.setLocalDescription(answer);
                    
                    await database.ref('sinalizacao/robo/answer').set({
                        type: answer.type,
                        sdp: answer.sdp
                    });
                }
            });

            // Recebe os candidatos ICE vindos do PC
            database.ref('sinalizacao/operador/iceCandidates').on('child_added', snapshot => {
                const candidate = snapshot.val();
                if (candidate) peerConnection.addIceCandidate(new RTCIceCandidate(candidate));
            });
        }
    </script>
</body>
</html>
