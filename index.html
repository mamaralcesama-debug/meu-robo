<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Robô - Central do Celular</title>
    <script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>
    <style>
        body { font-family: sans-serif; text-align: center; background-color: #f4f4f9; padding: 10px; }
        video { width: 100%; max-width: 400px; border-radius: 8px; border: 2px solid #ccc; transform: scaleX(-1); }
        button { padding: 12px 20px; font-size: 16px; border: none; border-radius: 5px; background-color: #007bff; color: white; cursor: pointer; margin: 10px 0; }
        button:active { background-color: #0056b3; }
        .status-box { background: #e9ecef; padding: 10px; border-radius: 5px; margin-bottom: 15px; }
    </style>
</head>
<body>
    <h2>Cérebro do Robô</h2>
    
    <div class="status-box">
        <p>Seu ID de Conexão (Copie para o PC): <br><strong id="peer-id" style="font-size: 1.2em; color: #d9534f;">Gerando...</strong></p>
    </div>

    <button id="btn-bluetooth">1. Conectar ao ESP32 (Bluetooth)</button>
    <p id="ble-status" style="font-weight: bold; color: #555;">Bluetooth Desconectado</p>

    <video id="video-stream" autoplay muted playsinline></video>
    
    <div class="status-box">
        <p id="sensor-data">GPS: Aguardando... | Bússola: Aguardando...</p>
    </div>

    <script>
        const peer = new Peer();
        let dataChannel;
        let localStream;

        // Gera o ID do WebRTC
        peer.on('open', id => { 
            document.getElementById('peer-id').innerText = id; 
        });

        // Inicia a câmera assim que a página abre
        navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" }, audio: true })
            .then(stream => {
                localStream = stream;
                document.getElementById('video-stream').srcObject = stream;
            }).catch(err => alert("Erro ao acessar câmera/microfone. Dê as permissões no navegador: " + err));

        // Aguarda a conexão do PC para comandos
        peer.on('connection', conn => {
            dataChannel = conn;
            console.log("PC conectado via dados.");

            // Assim que o PC conecta, o celular liga para ele enviando o vídeo
            if (localStream) {
                peer.call(conn.peer, localStream);
            }

            // Recebe as teclas do PC e repassa para o ESP32 via Bluetooth
            conn.on('data', data => {
                enviarComandoBLE(data);
            });
        });

        // Configuração do Bluetooth Low Energy (BLE) - MODO ARRASTÃO
        let bleCharacteristic;
        document.getElementById('btn-bluetooth').addEventListener('click', async () => {
            try {
                const device = await navigator.bluetooth.requestDevice({
                    // acceptAllDevices ignora o nome e lista tudo ao redor
                    acceptAllDevices: true, 
                    optionalServices: ['6e400001-b5a3-f393-e0a9-e50e24dcca9e']
                });
                
                const server = await device.gatt.connect();
                const service = await server.getPrimaryService('6e400001-b5a3-f393-e0a9-e50e24dcca9e');
                bleCharacteristic = await service.getCharacteristic('6e400002-b5a3-f393-e0a9-e50e24dcca9e');
                
                document.getElementById('ble-status').innerText = "ESP32 Conectado com Sucesso! 🟢";
                document.getElementById('ble-status').style.color = "green";
            } catch (error) { 
                alert("Erro BLE: " + error); 
            }
        });

        function enviarComandoBLE(cmd) {
            if (bleCharacteristic) {
                let encoder = new TextEncoder('utf-8');
                bleCharacteristic.writeValue(encoder.encode(cmd)).catch(err => console.log("Erro ao enviar BLE:", err));
            }
        }

        // Telemetria: GPS e Bússola
        setInterval(() => {
            if(dataChannel && dataChannel.open) {
                navigator.geolocation.getCurrentPosition(pos => {
                    dataChannel.send(JSON.stringify({
                        lat: pos.coords.latitude,
                        lon: pos.coords.longitude
                    }));
                }, err => console.log("Erro GPS:", err), { enableHighAccuracy: true });
            }
        }, 2000);

        window.addEventListener('deviceorientationabsolute', (event) => {
            if(dataChannel && dataChannel.open && event.alpha !== null) {
                let compass = Math.round(360 - event.alpha);
                dataChannel.send(JSON.stringify({ compass: compass }));
                document.getElementById('sensor-data').innerText = `Bússola: ${compass}°`;
            }
        });
    </script>
</body>
</html>
