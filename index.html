<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Robô - Central HUB (1 Sensor)</title>
    <style>
        body { font-family: Arial, sans-serif; background: #111; color: #fff; text-align: center; padding: 20px; }
        .btn-bt { background: #007aff; color: white; border: none; padding: 15px 20px; font-size: 16px; border-radius: 8px; font-weight: bold; width: 90%; max-width: 400px; }
        .btn-bt.bt-connected { background: #34c759; }
    </style>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
</head>
<body>

    <h1>Unidade Móvel (Foco Sensor Traseiro)</h1>
    <button id="btnBluetooth" class="btn-bt" onclick="conectarBluetoothESP32()">CONECTAR HARDWARE (ESP32)</button>
    <br><br>
    <video id="videoLocal1" autoplay playsinline muted style="width:90%; max-width:400px; border:2px solid #555;"></video>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAPJOs-lOFuA0zqZrJKmdrWrSr4Vf2dNx0",
            authDomain: "robo-webrtc-7b32b.firebaseapp.com",
            databaseURL: "https://robo-webrtc-7b32b-default-rtdb.firebaseio.com",
            projectId: "robo-webrtc-7b32b",
        };
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();
        let sinalizacaoRef = database.ref('sinalizacao');

        let localStream1 = null, peerConnection = null, dataChannel = null, intervaloTelemetria = null;
        let celularLat = 0.0, celularLon = 0.0, celularDirecao = 0;
        let distTras = "--"; // Foco exclusivo na traseira

        let bluetoothCharacteristic = null;
        const BLE_SERVICE_UUID = "6e400001-b5a3-f393-e0a9-e50e24dcca9e"; 
        const BLE_TX_UUID = "6e400002-b5a3-f393-e0a9-e50e24dcca9e";

        window.onload = async () => {
            if ('wakeLock' in navigator) await navigator.wakeLock.request('screen');
            await iniciarCameraResiliente();
            activarSensoresNativos();
            configurarEscutaSinalizacao();
        };

        async function iniciarCameraResiliente() {
            const videoElement = document.getElementById('videoLocal1');
            const dispositivos = await navigator.mediaDevices.enumerateDevices();
            let idCameraUSB = null;
            dispositivos.forEach(d => { if (d.kind === 'videoinput' && (d.label.toLowerCase().includes('usb') || d.label.toLowerCase().includes('external'))) idCameraUSB = d.deviceId; });
            let restricoes = idCameraUSB ? { video: { deviceId: { exact: idCameraUSB } }, audio: false } : { video: { facingMode: "environment" }, audio: false };
            localStream1 = await navigator.mediaDevices.getUserMedia(restricoes);
            videoElement.srcObject = localStream1;
        }

        async function conectarBluetoothESP32() {
            try {
                const device = await navigator.bluetooth.requestDevice({ filters: [{ name: 'Robo-Esteira' }], optionalServices: [BLE_SERVICE_UUID] });
                const server = await device.gatt.connect();
                const service = await server.getPrimaryService(BLE_SERVICE_UUID);
                bluetoothCharacteristic = await service.getCharacteristic(BLE_TX_UUID);
                
                await bluetoothCharacteristic.startNotifications();
                bluetoothCharacteristic.addEventListener('characteristicvaluechanged', (e) => {
                    const decoder = new TextDecoder();
                    const stringBruta = decoder.decode(e.target.value);
                    const par = stringBruta.split(':');
                    if(par[0] === 'T') distTras = par[1];
                });

                document.getElementById("btnBluetooth").className = "btn-bt bt-connected";
                document.getElementById("btnBluetooth").innerText = "SISTEMA INTEGRADO MESTRE";
            } catch (error) { alert(error.message); }
        }

        function enviarParaESP32(comando) {
            if (bluetoothCharacteristic) {
                const encoder = new TextEncoder();
                bluetoothCharacteristic.writeValue(encoder.encode(comando)).catch(e => {});
            }
        }

        function configurarEscutaSinalizacao() {
            sinalizacaoRef.child('operador/offer').on('value', async (snapshot) => {
                const offer = snapshot.val(); if (!offer) return;
                if (peerConnection) return;
                peerConnection = new RTCPeerConnection({ iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] });
                if (localStream1) localStream1.getTracks().forEach(t => peerConnection.addTrack(t, localStream1));
                peerConnection.onicecandidate = (e) => { if (e.candidate) sinalizacaoRef.child('robo/iceCandidates').push(e.candidate.toJSON()); };
                
                peerConnection.ondatachannel = (ev) => {
                    dataChannel = ev.channel;
                    dataChannel.onmessage = (e) => { enviarParaESP32(e.data); };
                    dataChannel.onopen = () => {
                        if (intervaloTelemetria) clearInterval(intervaloTelemetria);
                        intervaloTelemetria = setInterval(() => {
                            if (dataChannel && dataChannel.readyState === "open") {
                                // Envia apenas a telemetria do sensor traseiro
                                const pacote = `LAT:${celularLat};LON:${celularLon};DIR:${celularDirecao};TOF_T:${distTras}`;
                                dataChannel.send(JSON.stringify({ tipo: "telemetria", payload: pacote }));
                            }
                        }, 250);
                    };
                };
                await peerConnection.setRemoteDescription(new RTCSessionDescription(offer));
                const answer = await peerConnection.createAnswer(); await peerConnection.setLocalDescription(answer);
                await sinalizacaoRef.child('robo/answer').set({ type: answer.type, sdp: answer.sdp });
            });
            sinalizacaoRef.child('operador/iceCandidates').on('child_added', s => { if (s.val() && peerConnection) peerConnection.addIceCandidate(new RTCIceCandidate(s.val())); });
        }

        function activarSensoresNativos() {
            navigator.geolocation.watchPosition(p => { celularLat = p.coords.latitude; celularLon = p.coords.longitude; }, null, { enableHighAccuracy: true });
            if (window.DeviceOrientationEvent) { window.addEventListener("deviceorientationabsolute", e => { if (e.alpha !== null) celularDirecao = Math.round(e.alpha); }, true); }
        }
    </script>
</body>
</html>
