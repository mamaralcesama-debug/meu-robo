<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Robô - Central de Transmissão</title>
    <style>
        body { font-family: Arial, sans-serif; background: #111; color: #fff; text-align: center; padding: 20px; }
        .status-box { border: 1px solid #333; padding: 15px; margin: 10px auto; max-width: 400px; border-radius: 8px; background: #222; }
        .status { font-weight: bold; color: #ff3b30; }
        .connected { color: #4cd964; }
        video { width: 45%; margin: 5px; border: 2px solid #555; border-radius: 4px; background: #000; }
        button { background: #34c759; color: white; border: none; padding: 12px 24px; font-size: 16px; border-radius: 8px; cursor: pointer; font-weight: bold; }
        button:disabled { background: #555; cursor: not-allowed; }
    </style>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
</head>
<body>

    <h1>Robô Ativo</h1>
    <button id="btnIniciar" onclick="inicializarSistema()">LIGAR SISTEMA DO ROBÔ</button>

    <div class="status-box">
        <p>Status WebRTC: <span id="statusWebRTC" class="status">Desconectado</span></p>
        <p>Status ESP32 (Bluetooth): <span id="statusBluetooth" class="status">Desconectado</span></p>
        <p>Último Comando: <span id="txtComando">-</span></p>
    </div>

    <div>
        <video id="videoLocal1" autoplay playsinline muted></video>
        <video id="videoLocal2" autoplay playsinline muted></video>
    </div>

    <script>
        // --- ADICIONE SUAS CREDENCIAIS DO FIREBASE AQUI ---
        const firebaseConfig = {
  apiKey: "AIzaSyAPJOs-lOFuA0zqZrJKmdrWrSr4Vf2dNx0",
  authDomain: "robo-webrtc-7b32b.firebaseapp.com",
  databaseURL: "https://robo-webrtc-7b32b-default-rtdb.firebaseio.com",
  projectId: "robo-webrtc-7b32b",
  storageBucket: "robo-webrtc-7b32b.firebasestorage.app",
  messagingSenderId: "488205904754",
  appId: "1:488205904754:web:52a95187cb2896da5d8beb",
  measurementId: "G-N5F97EE30J"
};
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        // --- VARIÁVEIS GLOBAIS ---
        let localStream1, localStream2;
        let peerConnection;
        let dataChannel;
        let esp32Characteristic;
        let wakeLock = null;

        // Sensores internos do Celular e externos do ESP32
        let celularLat = 0.0;
        let celularLon = 0.0;
        let celularDirecao = 0;
        let esp32Distancia = "--";

        const configuration = { iceServers: [{ urls: 'stun:stun.l.google.com:19020' }] };

        // --- 1. INICIALIZAÇÃO GERAL ---
        async function inicializarSistema() {
            document.getElementById("btnIniciar").disabled = true;
            try {
                // Tenta manter a tela do celular sempre ligada
                if ('wakeLock' in navigator) {
                    wakeLock = await navigator.wakeLock.request('screen');
                    console.log("Wake Lock ativo: Tela travada.");
                }
                
                await iniciarCameras();
               // await conectarESP32();
                
                // Ativa os sensores nativos do celular
                ativarGPSCelular();
                ativarBussolaCelular();
                
                aguardarConexaoDoOperador();
            } catch (error) {
                alert("Erro ao inicializar: " + error.message);
                document.getElementById("btnIniciar").disabled = false;
            }
        }

        // --- 2. CAPTURA DE VÍDEO (INTERNA + USB OTG) ---
        async function iniciarCameras() {
            try {
                // Câmera 1: Traseira do Celular (Navegação)
                localStream1 = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: "environment" }, audio: false
                });
                document.getElementById('videoLocal1').srcObject = localStream1;

                // Câmera 2: Tenta capturar a câmera USB externa (UVC)
                const dispositivos = await navigator.mediaDevices.enumerateDevices();
                const camerasVideo = dispositivos.filter(device => device.kind === 'videoinput');
                
                if (camerasVideo.length > 1) {
                    localStream2 = await navigator.mediaDevices.getUserMedia({
                        video: { deviceId: { exact: camerasVideo[1].deviceId } }, audio: false
                    });
                    document.getElementById('videoLocal2').srcObject = localStream2;
                } else {
                    console.log("Segunda câmera não detectada pelo navegador. Usando apenas a traseira.");
                }
            } catch (e) {
                console.error("Erro ao acessar câmeras: ", e);
                throw new Error("Permissão de câmera negada ou dispositivo não encontrado.");
            }
        }

        // --- 3. SENSORES INTERNOS DO CELULAR (GPS E BÚSSOLA) ---
        function activarGPSCelular() {
            if ("geolocation" in navigator) {
                navigator.geolocation.watchPosition((position) => {
                    celularLat = position.coords.latitude;
                    celularLon = position.coords.longitude;
                }, (err) => console.error("Erro no GPS do celular:", err), 
                { enableHighAccuracy: true });
            }
        }

        function activarBussolaCelular() {
            if (window.DeviceOrientationEvent) {
                window.addEventListener("deviceorientationabsolute", (event) => {
                    if (event.alpha !== null) {
                        celularDirecao = Math.round(event.alpha); // Graus de 0 a 360
                    }
                }, true);
            }
        }

        // --- 4. BLUETOOTH DO ESP32 (APENAS COMANDOS E DISTÂNCIA) ---
        async function conectarESP32() {
            try {
                const device = await navigator.bluetooth.requestDevice({
                    filters: [{ name: 'ESP32_ROBO' }],
                    optionalServices: ['4fafc201-1fb5-459e-8fcc-c5c9c331914b']
                });

                const server = await device.gatt.connect();
                const service = await server.getPrimaryService('4fafc201-1fb5-459e-8fcc-c5c9c331914b');
                esp32Characteristic = await service.getCharacteristic('beb5483e-36e1-4688-b7f5-ea07361b26a8');
                
                // Configura para ouvir a leitura contínua do sensor de distância do ESP32
                await esp32Characteristic.startNotifications();
                esp32Characteristic.addEventListener('characteristicvaluechanged', tratarDadosSensores);

                document.getElementById("statusBluetooth").innerText = "Conectado";
                document.getElementById("statusBluetooth").className = "status connected";
            } catch (e) {
                console.error("Erro Bluetooth: ", e);
                throw new Error("Lembre-se de ativar o GPS do celular antes de buscar o Bluetooth.");
            }
        }

        // --- 5. FUSÃO DE DADOS (ESP32 + CELULAR) E ENVIO REALTIME ---
        function tratarDadosSensores(event) {
            const enc = new TextDecoder("utf-8");
            esp32Distancia = enc.decode(event.target.value).trim(); // Distância pura do laser
            
            // Empacota tudo no formato que o operador espera
            const pacoteTelemetria = `LAT:${celularLat};LON:${celularLon};DIR:${celularDirecao};DIST:${esp32Distancia}`;
            
            // Envia via WebRTC Data Channel sem passar por servidor externo
            if (dataChannel && dataChannel.readyState === "open") {
                dataChannel.send(JSON.stringify({ tipo: "telemetria", payload: pacoteTelemetria }));
            }
        }

        // --- 6. INFRAESTRUTURA WEBRTC (SINALIZAÇÃO) ---
        function aguardarConexaoDoOperador() {
            peerConnection = new RTCPeerConnection(configuration);

            if (localStream1) localStream1.getTracks().forEach(track => peerConnection.addTrack(track, localStream1));
            if (localStream2) localStream2.getTracks().forEach(track => peerConnection.addTrack(track, localStream2));

            peerConnection.ondatachannel = (event) => {
                dataChannel = event.channel;
                dataChannel.onmessage = receberComandoOperador;
                dataChannel.onopen = () => {
                    document.getElementById("statusWebRTC").innerText = "Conectado ao Operador";
                    document.getElementById("statusWebRTC").className = "status connected";
                };
            };

            const iceCandidatesRef = database.ref('sinalizacao/robo/iceCandidates');
            peerConnection.onicecandidate = (event) => {
                if (event.candidate) iceCandidatesRef.push(event.candidate.toJSON());
            };

            database.ref('sinalizacao/operador/offer').on('value', async (snapshot) => {
                const offer = snapshot.val();
                if (offer && !peerConnection.currentRemoteDescription) {
                    await peerConnection.setRemoteDescription(new RTCSessionDescription(offer));
                    const answer = await peerConnection.createAnswer();
                    await peerConnection.setLocalDescription(answer);
                    
                    await database.ref('sinalizacao/robo/answer').set({
                        type: answer.type,
                        sdp: answer.sdp
                    });
                }
            });

            database.ref('sinalizacao/operador/iceCandidates').on('child_added', snapshot => {
                const candidate = snapshot.val();
                if (candidate) peerConnection.addIceCandidate(new RTCIceCandidate(candidate));
            });
        }

        // --- 7. EXECUÇÃO DE COMANDO DE MOVIMENTO ---
        function receberComandoOperador(event) {
            const comando = event.data; 
            document.getElementById("txtComando").innerText = comando;

            // Envia imediatamente via Bluetooth para os motores do ESP32
            if (esp32Characteristic) {
                const encoder = new TextEncoder();
                esp32Characteristic.writeValue(encoder.encode(comando)).catch(err => {
                    console.error("Erro de envio Bluetooth:", err);
                });
            }
        }
    </script>
</body>
</html>
