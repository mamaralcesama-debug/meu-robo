<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Robô - Central de Transmissão</title>
    <style>
        body { font-family: Arial, sans-serif; background: #111; color: #fff; text-align: center; padding: 20px; }
        .status-box { border: 1px solid #333; padding: 15px; margin: 10px auto; max-width: 400px; border-radius: 8px; background: #222; }
        .status { font-weight: bold; color: #ff3b30; }
        .connected { color: #4cd964; }
        video { width: 90%; max-width: 400px; margin: 5px; border: 2px solid #555; border-radius: 4px; background: #000; }
        button { background: #34c759; color: white; border: none; padding: 15px 30px; font-size: 16px; border-radius: 8px; cursor: pointer; font-weight: bold; width: 100%; max-width: 400px; }
        button:disabled { background: #555; cursor: not-allowed; }
    </style>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
</head>
<body>

    <h1>Robô Ativo (iOS Homologado)</h1>
    <button id="btnIniciar" onclick="solicitarPermissoesIPhone()">LIGAR SISTEMA DO ROBÔ</button>

    <div class="status-box">
        <p>Status WebRTC: <span id="statusWebRTC" class="status">Desconectado</span></p>
        <p>Status ESP32 (Bluetooth): <span id="statusBluetooth" class="status">Desconectado (Ignorado)</span></p>
        <p>Bússola Local: <span id="txtBussola" style="color: #ff9500; font-weight: bold;">0°</span></p>
        <p>Último Comando: <span id="txtComando">-</span></p>
    </div>

    <div>
        <video id="videoLocal1" autoplay playsinline muted></video>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAPJOs-lOFuA0zqZrJKmdrWrSr4Vf2dNx0",
            authDomain: "robo-webrtc-7b32b.firebaseapp.com",
            databaseURL: "https://robo-webrtc-7b32b-default-rtdb.firebaseio.com",
            projectId: "robo-webrtc-7b32b",
            storageBucket: "robo-webrtc-7b32b.firebasestorage.app",
            messagingSenderId: "488205904754",
            appId: "1:488205904754:web:52a95187cb2896da5d8beb",
            measurementId: "G-N5F97EE30J"
        };
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();
        window.onerror = function(msg, url, linenumber) { alert('Erro: '+msg+' na linha: '+linenumber); return true; }
        let localStream1;
        let peerConnection;
        let dataChannel;
        let wakeLock = null;

        let celularLat = 0.0;
        let celularLon = 0.0;
        let celularDirecao = 0;
        let esp32Distancia = "--";

        const configuration = { iceServers: [{ urls: 'stun:stun.l.google.com:19020' }] };

        // --- ENTRADA DE SEGURANÇA EXCLUSIVA PARA O IPHONE ---
        function solicitarPermissoesIPhone() {
            // Desativa o botão para evitar cliques duplos
            document.getElementById("btnIniciar").disabled = true;

            // Força o pedido da bússola no exato momento do toque físico
            if (window.DeviceOrientationEvent && typeof DeviceOrientationEvent.requestPermission === 'function') {
                DeviceOrientationEvent.requestPermission()
                    .then(permissionState => {
                        if (permissionState === 'granted') {
                            window.addEventListener("deviceorientationabsolute", tratarOrientacao, true);
                            console.log("Bússola do iOS autorizada.");
                        } else {
                            console.log("Permissão da bússola negada pelo usuário.");
                        }
                        // Segue com o fluxo normal após resolver a bússola
                        inicializarSistema();
                    })
                    .catch(err => {
                        console.error("Erro ao pedir bússola:", err);
                        // Mesmo se der erro no sensor, tenta rodar o vídeo
                        inicializarSistema();
                    });
            } else {
                // Se for Android, não precisa do prompt especial, apenas liga
                if (window.DeviceOrientationEvent) {
                    window.addEventListener("deviceorientationabsolute", tratarOrientacao, true);
                }
                inicializarSistema();
            }
        }

        async function inicializarSistema() {
            try {
                if ('wakeLock' in navigator) {
                    wakeLock = await navigator.wakeLock.request('screen');
                }
                
                await iniciarCameras();
                ativarGPSCelular();
                aguardarConexaoDoOperador();
            } catch (error) {
                alert("Erro no sistema de mídia: " + error.message);
                document.getElementById("btnIniciar").disabled = false;
            }
        }

        async function iniciarCameras() {
            try {
                localStream1 = await navigator.mediaDevices.getUserMedia({
                    video: { 
                        facingMode: "environment",
                        width: { ideal: 640 },
                        height: { ideal: 480 }
                    }, 
                    audio: false
                });
                
                const videoElement = document.getElementById('videoLocal1');
                videoElement.srcObject = localStream1;
                await videoElement.play();
            } catch (e) {
                console.error("Erro na câmera:", e);
                throw new Error("Verifique se o Safari tem permissão de câmera nas configurações do iPhone.");
            }
        }

        function tratarOrientacao(event) {
            if (event.alpha !== null) {
                celularDirecao = Math.round(event.alpha);
                document.getElementById("txtBussola").innerText = celularDirecao + "°";
            }
        }

        function ativarGPSCelular() {
            if ("geolocation" in navigator) {
                navigator.geolocation.watchPosition((position) => {
                    celularLat = position.coords.latitude;
                    celularLon = position.coords.longitude;
                }, (err) => console.error("Erro GPS:", err), { enableHighAccuracy: true });
            }
        }

        function aguardarConexaoDoOperador() {
            peerConnection = new RTCPeerConnection(configuration);

            if (localStream1) {
                localStream1.getTracks().forEach(track => peerConnection.addTrack(track, localStream1));
            }

            peerConnection.ondatachannel = (event) => {
                dataChannel = event.channel;
                dataChannel.onmessage = (e) => { document.getElementById("txtComando").innerText = e.data; };
                dataChannel.onopen = () => {
                    document.getElementById("statusWebRTC").innerText = "Conectado ao Operador";
                    document.getElementById("statusWebRTC").className = "status connected";

                    setInterval(() => {
                        if (dataChannel && dataChannel.readyState === "open") {
                            const pacoteTelemetria = `LAT:${celularLat};LON:${celularLon};DIR:${celularDirecao};DIST:${esp32Distancia}`;
                            dataChannel.send(JSON.stringify({ tipo: "telemetria", payload: pacoteTelemetria }));
                        }
                    }, 500);
                };
            };

            const iceCandidatesRef = database.ref('sinalizacao/robo/iceCandidates');
            peerConnection.onicecandidate = (event) => {
                if (event.candidate) iceCandidatesRef.push(event.candidate.toJSON());
            };

            database.ref('sinalizacao/operador/offer').on('value', async (snapshot) => {
                const offer = snapshot.val();
                if (offer && !peerConnection.currentRemoteDescription) {
                    await peerConnection.setRemoteDescription(new RTCSessionDescription(offer));
                    const answer = await peerConnection.createAnswer();
                    await peerConnection.setLocalDescription(answer);
                    
                    await database.ref('sinalizacao/robo/answer').set({
                        type: answer.type,
                        sdp: answer.sdp
                    });
                }
            });

            database.ref('sinalizacao/operador/iceCandidates').on('child_added', snapshot => {
                const candidate = snapshot.val();
                if (candidate) peerConnection.addIceCandidate(new RTCIceCandidate(candidate));
            });
        }
    </script>
</body>
</html>
