<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Robô - Câmera e Sensores</title>
    <script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>
    <style>body { font-family: sans-serif; text-align: center; } video { width: 100%; max-width: 400px; }</style>
</head>
<body>
    <h2>Robô - Central do Celular</h2>
    <p>Seu ID de Conexão: <strong id="peer-id">Gerando...</strong></p>
    <button id="btn-bluetooth">1. Conectar ao ESP32 (Bluetooth)</button>
    <p id="ble-status">Bluetooth Desconectado</p>
    <video id="video-stream" autoplay muted playsinline></video>
    <p id="sensor-data">GPS: Aguardando... | Bússola: Aguardando...</p>

    <script>
        // 1. Configuração do WebRTC (PeerJS)
        const peer = new Peer();
        let peerConnection;
        let dataChannel;
        let localStream;

        peer.on('open', id => { document.getElementById('peer-id').innerText = id; });

        peer.on('call', call => {
            call.answer(localStream); // Envia o vídeo/áudio quando o PC ligar
        });

        peer.on('connection', conn => {
            dataChannel = conn;
            conn.on('data', data => {
                console.log("Comando recebido: ", data);
                enviarComandoBLE(data); // Repassa o comando (F, B, L, R, S) para o ESP32
            });
        });

        // 2. Câmera e Áudio
        navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" }, audio: true })
            .then(stream => {
                localStream = stream;
                document.getElementById('video-stream').srcObject = stream;
            }).catch(err => console.error("Erro na câmera: ", err));

        // 3. Bluetooth Low Energy (Web Bluetooth API)
        let bleCharacteristic;
        document.getElementById('btn-bluetooth').addEventListener('click', async () => {
            try {
                const device = await navigator.bluetooth.requestDevice({
                    filters: [{ name: 'Robo_ESP32' }],
                    optionalServices: ['6e400001-b5a3-f393-e0a9-e50e24dcca9e']
                });
                const server = await device.gatt.connect();
                const service = await server.getPrimaryService('6e400001-b5a3-f393-e0a9-e50e24dcca9e');
                bleCharacteristic = await service.getCharacteristic('6e400002-b5a3-f393-e0a9-e50e24dcca9e');
                document.getElementById('ble-status').innerText = "ESP32 Conectado!";
            } catch (error) { console.error("Erro BLE:", error); }
        });

        function enviarComandoBLE(cmd) {
            if (bleCharacteristic) {
                let encoder = new TextEncoder('utf-8');
                bleCharacteristic.writeValue(encoder.encode(cmd));
            }
        }

        // 4. Sensores (GPS e Bússola)
        setInterval(() => {
            let sensorMsg = {};
            navigator.geolocation.getCurrentPosition(pos => {
                sensorMsg.lat = pos.coords.latitude;
                sensorMsg.lon = pos.coords.longitude;
            });
            
            // O envio ocorre se houver conexão com o PC
            if(dataChannel && dataChannel.open) {
                dataChannel.send(JSON.stringify(sensorMsg));
            }
        }, 2000); // Atualiza GPS a cada 2s

        window.addEventListener('deviceorientationabsolute', (event) => {
            if(dataChannel && dataChannel.open && event.alpha !== null) {
                dataChannel.send(JSON.stringify({ compass: Math.round(360 - event.alpha) }));
                document.getElementById('sensor-data').innerText = `Bússola: ${Math.round(360 - event.alpha)}°`;
            }
        });
    </script>
</body>
</html>
